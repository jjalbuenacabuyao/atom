# Full Atom stack: PostgreSQL + Go API + Angular SPA (nginx).
# Usage: JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
# Then open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atom}
      POSTGRES_DB: atom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atom -d atom"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./server
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://atom:${POSTGRES_PASSWORD:-atom}@db:5432/atom?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>= 32 chars)}
      # Set to true when serving over HTTPS (recommended in production).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # nginx in the web container is the only proxy allowed to set X-Forwarded-For.
      TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./client
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
