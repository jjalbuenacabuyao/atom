@let h = habit();
<a
  class="flex min-w-0 flex-1 items-center gap-3.5 rounded-md text-inherit no-underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
  [routerLink]="['/habits', h.id]"
>
  <app-habit-avatar [icon]="h.icon" [color]="h.color" />
  <div class="grid min-w-0 gap-0.5">
    <span class="type-title-medium group-[.done]:text-on-surface-variant">
      {{ h.name }}
      @if (h.kind === 'break') {
        <span
          class="ml-1.5 rounded-full bg-error-container px-2 py-0.5 align-middle type-label-small text-on-error-container"
          >breaking</span
        >
      }
    </span>
    @if (cue()) {
      <span class="truncate type-body-small text-on-surface-variant">{{ cue() }}</span>
    }
    @if (h.easyNote) {
      <span class="inline-flex items-center gap-1 truncate type-body-small text-on-surface-variant"
        ><mat-icon aria-hidden="true" class="icon-3.5!">timer</mat-icon>{{ h.easyNote }}</span
      >
    }
  </div>
</a>
<span
  class="inline-flex items-center gap-0.5 type-label-large"
  [class]="h.stats.currentStreak >= 3 ? 'text-tertiary' : 'text-on-surface-variant'"
  [matTooltip]="'Current streak · best ' + h.stats.longestStreak"
>
  <mat-icon
    aria-hidden="true"
    class="icon-5!"
    [class.[font-variation-settings:'FILL'_1]]="h.stats.currentStreak >= 3"
    >local_fire_department</mat-icon
  >
  <span class="sr-only">Streak</span>{{ h.stats.currentStreak }}
</span>
<button
  type="button"
  class="check"
  [class.checked]="h.stats.completedToday"
  [disabled]="pending()"
  [attr.aria-pressed]="h.stats.completedToday"
  [attr.aria-label]="label()"
  (click)="toggled.emit(h)"
>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path [attr.d]="checkPath()" [style.d]="checkCss()" />
  </svg>
  <mat-icon aria-hidden="true">check</mat-icon>
</button>
